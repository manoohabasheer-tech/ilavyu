<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Always You 💗</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap');

*{box-sizing:border-box;}

body{
  margin:0;
  height:100vh;
  background:linear-gradient(135deg,#ffd1dc,#ffe6f3,#fff0f6);
  font-family:'Poppins',sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* floating hearts */
.heart{
  position:absolute;
  font-size:20px;
  animation:floatUp 8s infinite;
  opacity:0;
}
@keyframes floatUp{
  0%{transform:translateY(0);opacity:0;}
  20%{opacity:0.8;}
  100%{transform:translateY(-160px);opacity:0;}
}

/* card */
.card{
  width:380px;
  height:420px;
  background:rgba(255,255,255,0.97);
  border-radius:30px;
  padding:30px;
  text-align:center;
  box-shadow:0 20px 50px rgba(255,105,180,0.5);
  animation:pop 0.6s ease;
  position:relative;
}
@keyframes pop{
  0%{transform:scale(0.7);opacity:0;}
  100%{transform:scale(1);opacity:1;}
}

.pookie{
  font-size:50px;
  animation:bounce 1.6s infinite;
}
@keyframes bounce{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-12px);}
}

h2{
  font-family:'Pacifico',cursive;
  color:#ff4d88;
  line-height:1.5;
  min-height:140px;
}

button{
  padding:12px 28px;
  border:none;
  border-radius:40px;
  font-size:16px;
  cursor:pointer;
  transition:transform 0.2s ease;
}
button:hover{transform:scale(1.15);}

#yes{
  background:linear-gradient(135deg,#ff4d88,#ff85b3);
  color:white;
  box-shadow:0 6px 16px rgba(255,77,136,0.5);
}
#no{
  background:#fff0f6;
  color:#ff4d88;
  position:absolute;
  left:220px;
  top:310px;
}

#page2{display:none;}

.cringe{
  font-family:'Pacifico',cursive;
  font-size:22px;
  color:#ff4d88;
}
.sub{
  font-size:14px;
  color:#ff6fa5;
}

img{
  width:230px;
  margin-top:10px;
  border-radius:20px;
}

.explode{
  animation:explode 0.8s ease-in-out;
}
@keyframes explode{
  0%{transform:scale(1);}
  50%{transform:scale(1.25) rotate(5deg);}
  100%{transform:scale(1);}
}
</style>
</head>

<body>

  <!-- floating hearts -->
<span class="heart" style="top:10%; left:10%;">💖</span>
<span class="heart" style="top:20%; left:20%;">💕</span>
<span class="heart" style="top:75%; left:30%;">💗</span>
<span class="heart" style="top:65%; left:40%;">🥰</span>
<span class="heart" style="top:35%; left:50%;">💘</span>
<span class="heart" style="top:90%; left:60%;">😚</span>
<span class="heart" style="top:10%; left:70%;">💖</span>
<span class="heart" style="top:20%; left:80%;">💕</span>
<span class="heart" style="top:75%; left:90%;">💗</span>
<span class="heart" style="top:65%; left:55%;">🥰</span>
<span class="heart" style="top:35%; left:45%;">💘</span>
<span class="heart" style="top:90%; left:75%;">😚</span>


<!-- hearts -->
<script>
for(let i=0;i<30;i++){
  let h=document.createElement("div");
  h.className="heart";
  h.innerHTML=["💗","💖","💕","💘","🥰","😚"][Math.floor(Math.random()*6)];
  h.style.left=Math.random()*100+"%";
  h.style.bottom="-30px";
  h.style.animationDelay=Math.random()*6+"s";
  document.body.appendChild(h);
}
</script>

<!-- PAGE 1 -->
<div class="card" id="page1">
  <div class="pookie">🐻‍❄️💗</div>
  <h2 id="typeText"></h2>
  <button id="yes" onclick="showLove()">YESSS🥹💞</button>
  <button id="no" onmouseover="moveNo()">NO😳</button>
</div>

<!-- PAGE 2 -->
<div class="card" id="page2">
  <div class="pookie">🫶💞</div>
  <h2 class="cringe">
    I laaav yuu shuttumaniiee🥹💗<br>
   I don’t say this enough,<br>
    but you’re my favorite place to be🫠💗
  </h2>
  <p class="sub">
    my always, my constant💞<br>
    my “I choose you” in every universe 🌍✨
  </p>
  <img src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif">
</div>

<script>
/* typewriter */
const text="Aukareeyyy🥹💞\nYou are my today,\nmy tomorrow,\nand my alwaysssss 🫠💗";
let i=0;
function typeEffect(){
  if(i<text.length){
    document.getElementById("typeText").innerHTML +=
      text.charAt(i)==="\n" ? "<br>" : text.charAt(i);
    i++;
    setTimeout(typeEffect,70);
  }
}
typeEffect();

/* no button run away */
const noTexts=[
  "pls no😭","don’t do this😔","i’ll cry🥺","that hurt💔",
  "click yes😡","nononono🥹","why u like this😭",
  "YES ONLY😤","aaba pls🥺","sorry sorry😭"
];
function moveNo(){
  const noBtn=document.getElementById("no");
  const card=document.getElementById("page1");
  noBtn.innerText=noTexts[Math.floor(Math.random()*noTexts.length)];
  const maxX=card.clientWidth-noBtn.offsetWidth;
  const maxY=card.clientHeight-noBtn.offsetHeight;
  noBtn.style.left=Math.random()*maxX+"px";
  noBtn.style.top=Math.random()*maxY+"px";
}

/* show page 2 */
function showLove(){
  document.getElementById("page1").classList.add("explode");
  setTimeout(()=>{
    document.getElementById("page1").style.display="none";
    document.getElementById("page2").style.display="block";
    document.getElementById("page2").classList.add("explode");
  },400);
}
</script>

</body>
</html>
