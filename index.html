<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Always You 💗</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap');

*{box-sizing:border-box;}

body{
  margin:0;
  height:100vh;
  background:linear-gradient(135deg,#ffd1dc,#ffe6f3,#fff0f6);
  font-family:'Poppins',sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.card{
  width:380px;
  height:420px;
  background:white;
  border-radius:30px;
  padding:30px;
  text-align:center;
  box-shadow:0 20px 50px rgba(255,105,180,0.5);
  position:relative;
}

.pookie{
  font-size:50px;
  animation:bounce 1.6s infinite;
}

@keyframes bounce{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-12px);}
}

h2{
  font-family:'Pacifico',cursive;
  color:#ff4d88;
  min-height:140px;
  line-height:1.5;
}

/* BUTTON AREA */
.buttons{
  display:flex;
  margin-top:25px;
  position:relative;
}

.yes-zone,.no-zone{
  width:50%;
  position:relative;
  height:60px;
}

#yes{
  padding:12px 28px;
  border:none;
  border-radius:40px;
  font-size:16px;
  cursor:pointer;
  background:linear-gradient(135deg,#ff4d88,#ff85b3);
  color:white;
  box-shadow:0 6px 16px rgba(255,77,136,0.5);
}

#yes:hover{transform:scale(1.1);}

#no{
  position:absolute;
  padding:12px 26px;
  border:none;
  border-radius:40px;
  font-size:16px;
  cursor:pointer;
  background:#fff0f6;
  color:#ff4d88;
}

/* PAGE 2 */
#page2{display:none;}

.cringe{
  font-family:'Pacifico',cursive;
  font-size:22px;
  color:#ff4d88;
}

.sub{
  font-size:14px;
  color:#ff6fa5;
}

img{
  width:220px;
  margin-top:10px;
  border-radius:20px;
}

/* floating emojis */
.emoji{
  position:absolute;
  animation:floatUp 8s infinite linear;
  opacity:0;
}

@keyframes floatUp{
  0%{transform:translateY(0);opacity:0;}
  20%{opacity:0.8;}
  100%{transform:translateY(-220px) rotate(360deg);opacity:0;}
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="card" id="page1">
  <div class="pookie">🐻‍❄️💗</div>

  <h2 id="typeText"></h2>

  <div class="buttons">
    <div class="yes-zone">
      <button id="yes" onclick="showLove()">YESSS 🥹💞</button>
    </div>

    <div class="no-zone">
      <button id="no" onmouseover="moveNo()">NO 😳</button>
    </div>
  </div>
</div>

<!-- PAGE 2 -->
<div class="card" id="page2">
  <div class="pookie">🫶💞</div>

  <h2 class="cringe">
    I laaav yuu shuttumaniiee🥹💗<br>
    you’re my favorite place to be 🫠💗
  </h2>

  <p class="sub">
    my always 💞<br>
    my constant 🫶
  </p>

  <img src="https://media.giphy.com/media/26FLdmIp6wJr91JAI/giphy.gif">
</div>

<script>
/* TYPEWRITER */
const text="Aukareeyyy🥹💞\nYou are my today,\nmy tomorrow,\nand my alwaysssss 🫠💗";
let i=0;

function typeEffect(){
  if(i<text.length){
    document.getElementById("typeText").innerHTML +=
      text[i]==="\n"?"<br>":text[i];
    i++;
    setTimeout(typeEffect,70);
  }
}
typeEffect();

/* NO BUTTON MOVES ONLY IN ITS HALF */
const noTexts=["pls no😭","don’t😔","i’ll cry🥺","that hurt💔","YES ONLY😡"];

function moveNo(){
  const noBtn=document.getElementById("no");
  const zone=document.querySelector(".no-zone");

  noBtn.innerText=noTexts[Math.floor(Math.random()*noTexts.length)];

  const maxX = zone.clientWidth - noBtn.offsetWidth;
  const maxY = zone.clientHeight - noBtn.offsetHeight;

  noBtn.style.left = Math.random()*maxX + "px";
  noBtn.style.top  = Math.random()*maxY + "px";
}

/* SHOW PAGE 2 */
function showLove(){
  document.getElementById("page1").style.display="none";
  document.getElementById("page2").style.display="block";
}

/* FLOATING EMOJIS */
const emojis=["💗","💖","💕","💘","🥰","😚","🎀","💝","🌸"];
for(let i=0;i<30;i++){
  let e=document.createElement("div");
  e.className="emoji";
  e.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];
  e.style.left=Math.random()*window.innerWidth+"px";
  e.style.bottom="-20px";
  e.style.fontSize=(16+Math.random()*18)+"px";
  e.style.animationDelay=Math.random()*6+"s";
  document.body.appendChild(e);
}
</script>

</body>
</html>
