<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Always You 💗</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins&display=swap');

*{box-sizing:border-box}
body{
  margin:0;height:100vh;overflow:hidden;
  display:flex;justify-content:center;align-items:center;
  font-family:Poppins,sans-serif;
  background:linear-gradient(135deg,#ffd1dc,#ffe6f3,#fff0f6);
}

/* emoji bg */
#bg{position:fixed;inset:0;pointer-events:none}
.emoji{
  position:absolute;opacity:0;
  animation:float 8s linear infinite;
}
@keyframes float{
  0%{opacity:0;transform:translateY(0)}
  20%{opacity:.8}
  100%{opacity:0;transform:translateY(-220px)}
}

/* card */
.card{
  width:380px;height:420px;padding:30px;
  background:#fff;border-radius:30px;
  text-align:center;z-index:2;
  box-shadow:0 20px 50px rgba(255,105,180,.5);
  animation:pop .6s ease;
}
@keyframes pop{from{scale:.7;opacity:0}to{scale:1;opacity:1}}

.pookie{font-size:50px;animation:bounce 1.6s infinite}
@keyframes bounce{50%{transform:translateY(-12px)}}

h2{
  min-height:140px;line-height:1.5;
  font-family:Pacifico,cursive;color:#ff4d88;
}

button{
  padding:12px 28px;border:0;border-radius:40px;
  font-size:16px;cursor:pointer;
}
button:hover{transform:scale(1.15)}

#yes{
  background:linear-gradient(135deg,#ff4d88,#ff85b3);
  color:#fff;box-shadow:0 6px 16px rgba(255,77,136,.5);
}
#no{
  background:#fff0f6;color:#ff4d88;
  position:absolute;top:310px;left:150px;
}

#page2{display:none}
.sub{font-size:14px;color:#ff6fa5}
img{
  width:230px;margin-top:10px;border-radius:20px;
  box-shadow:0 10px 30px rgba(255,77,136,.4);
}
</style>
</head>

<body>

<div id="bg"></div>

<div class="card" id="page1">
  <div class="pookie">🐻‍❄️💗</div>
  <h2 id="text"></h2>
  <button id="yes" onclick="show()">YESSS🥹💞</button>
  <button id="no" onmouseover="move()">NO😳</button>
</div>

<div class="card" id="page2">
  <div class="pookie">🫶💞</div>
  <h2>
    I laaav yuu shuttumaniiee🥹💗<br>
    you’re my favorite place🫠💗
  </h2>
  <p class="sub">
    my always, my constant💞<br>
    my “I choose you” 🌍✨
  </p>
  <img src="https://i.giphy.com/26FLdmIp6wJr91JAI.gif">
</div>

<script>
/* bg emojis */
const E=["💗","💖","💕","💘","🥰","🎀","🌸","🫶"],bg=document.getElementById("bg");
for(let i=0;i<30;i++){
  bg.innerHTML+=`<div class="emoji" style="
    left:${Math.random()*100}%;
    top:${60+Math.random()*40}%;
    font-size:${14+Math.random()*18}px;
    animation-delay:${Math.random()*6}s
  ">${E[Math.random()*E.length|0]}</div>`;
}

/* typewriter */
const t="Aukareeyyy🥹💞\nYou are my today,\nmy tomorrow,\nand my alwaysssss 🫠💗";
let i=0;
(function type(){
  if(i<t.length){
    text.innerHTML+=t[i]=="\n"?"<br>":t[i++];
    setTimeout(type,70);
  }
})();

/* no dodge */
const N=["pls no😭","i’ll cry🥺","that hurt💔","click yes😡","nonono🥹"];
function move(){
  const b=no,c=page1;
  b.textContent=N[Math.random()*N.length|0];
  b.style.left=Math.random()*(c.clientWidth-b.offsetWidth)+"px";
  b.style.top=Math.random()*(c.clientHeight-b.offsetHeight)+"px";
}

/* page switch */
function show(){
  page1.style.display="none";
  page2.style.display="block";
}
</script>

</body>
</html>
